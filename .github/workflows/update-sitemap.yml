name: Update GulfJobsIndia Sitemap

on:
  schedule:
    # GitHub Actions cron is UTC. Runs at 00:00, 10:00 and 20:00 UTC daily.
    - cron: '0 0,10,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate sitemap from published jobs
        run: node scripts/generate-sitemap.mjs
        env:
          SITE_URL: https://gulfjobsindia.pages.dev
          API_URL: https://gulfjobsindia.gulfjob.workers.dev

      - name: Commit sitemap if changed
        run: |
          if git diff --quiet -- public/sitemap.xml; then
            echo "Sitemap unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/sitemap.xml
            git commit -m "chore: update GulfJobsIndia sitemap"
            git push
          fi
